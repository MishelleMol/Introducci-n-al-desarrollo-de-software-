<section class="proyectos">
  <h2>Mis Proyectos</h2>

  <p *ngIf="cargando">Cargando proyectos...</p>
  <p *ngIf="errorMensaje">{{ errorMensaje }}</p>

  <div class="lista-proyectos" *ngIf="!cargando && repos.length > 0">
    <div class="card" *ngFor="let repo of repos">
      <h3>{{ repo.name }}</h3>
      <p>{{ repo.description || 'Sin descripción disponible.' }}</p>
      <p><strong>Lenguaje:</strong> {{ repo.language || 'No disponible' }}</p>
      <p><strong>Estrellas:</strong> {{ repo.stargazers_count }}</p>
      <a [href]="repo.html_url" target="_blank" rel="noopener noreferrer">
        Ver repositorio
      </a>
    </div>
  </div>
</section>
